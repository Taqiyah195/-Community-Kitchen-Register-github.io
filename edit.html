<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Record - Community Kitchen</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="hero">
            <h1>🍲 Edit Daily Distribution Record</h1>
            <p>Update the meal distribution and stock details.</p>
        </header>


        <!-- Edit Form -->
        <section class="form-card">

            <form method="POST">

                <!-- Date -->
                <div class="form-group">
                    <label for="date">Date</label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        value="{{ record['date'] }}"
                        required
                    >
                </div>


                <!-- Meals Served -->
                <div class="form-group">
                    <label for="meals_served">Meals Served</label>

                    <input
                        type="number"
                        id="meals_served"
                        name="meals_served"
                        value="{{ record['meals_served'] }}"
                        required
                    >
                </div>


                <!-- Rice -->
                <div class="form-group">
                    <label for="rice_kg">Rice (kg)</label>

                    <input
                        type="number"
                        step="0.1"
                        id="rice_kg"
                        name="rice_kg"
                        value="{{ record['rice_kg'] }}"
                        required
                    >
                </div>


                <!-- Dal -->
                <div class="form-group">
                    <label for="dal_kg">Dal (kg)</label>

                    <input
                        type="number"
                        step="0.1"
                        id="dal_kg"
                        name="dal_kg"
                        value="{{ record['dal_kg'] }}"
                        required
                    >
                </div>


                <!-- Vegetables -->
                <div class="form-group">
                    <label for="vegetables_kg">Vegetables (kg)</label>

                    <input
                        type="number"
                        step="0.1"
                        id="vegetables_kg"
                        name="vegetables_kg"
                        value="{{ record['vegetables_kg'] }}"
                        required
                    >
                </div>


                <!-- Stock -->
                <div class="form-group">
                    <label for="stock_balance">Stock (kg)</label>

                    <input
                        type="number"
                        step="0.1"
                        id="stock_balance"
                        name="stock_balance"
                        value="{{ record['stock_balance'] }}"
                        required
                    >
                </div>


                <!-- Cost -->
                <div class="form-group">
                    <label for="cost_per_meal">Cost per Meal ($)</label>

                    <input
                        type="number"
                        step="0.01"
                        id="cost_per_meal"
                        name="cost_per_meal"
                        value="{{ record['cost_per_meal'] }}"
                        required
                    >
                </div>


                <!-- Buttons -->
                <div class="form-actions">

                    <button type="submit" class="btn">
                        💾 Update Record
                    </button>

                    <a href="{{ url_for('index') }}" class="back-link">
                        ← Back to Dashboard
                    </a>

                </div>

            </form>

        </section>

    </div>

</body>
</html>
